name: Frontend foundation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Guard removed remote plugin APIs
        run: |
          if grep -R -n -E 'evaluatePluginSource|installPluginFromUrl|PLUGIN_REGISTRY_URL' src; then
            echo '远程插件执行链路禁止恢复'
            exit 1
          fi

      - name: Test FE-0 foundation
        run: bun run test:foundation

      - name: Test FE-1 HTTP client
        run: bun run lint:http && bun run test:http && bun run test:auth && bun run test:wallet-team

      - name: Build
        run: bun run build
