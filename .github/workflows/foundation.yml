name: Frontend foundation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Guard removed remote plugin APIs
        run: |
          if grep -R -n -E 'evaluatePluginSource|installPluginFromUrl|PLUGIN_REGISTRY_URL' src; then
            echo '远程插件执行链路禁止恢复'
            exit 1
          fi

      - name: Test FE-0 foundation
        run: npm run test:foundation

      - name: Build
        run: npm run build
